# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - nova-l1-support

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: noval1suport.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_46F0BD81CCAA49EF851E61522E406497 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_AB62ABA9059D4609A7C6BEC6B27FECA5 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: noval1suport.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_46F0BD81CCAA49EF851E61522E406497 }}/nova-bot :${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D674DAFE429446EA05914D537CF482C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3C173B61BFA34F37BE8C6B1E623B4958 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2870DD03817042A0B7C3EBC56622B0A7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'nova-l1-support'
          slot-name: 'Production'
          images: 'noval1suport.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_46F0BD81CCAA49EF851E61522E406497 }}/nova-bot:${{ github.sha }}'
          
